<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Panel | THP Home Tutor</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://www.gstatic.com/firebasejs/9.0.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.0.0/firebase-firestore-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.0.0/firebase-auth-compat.js"></script>
    <style>
        :root{--primary:#6C5CE7;--success:#10b981;--danger:#ef4444;--warning:#f59e0b;--bg:#f1f5f9;--surface:#ffffff;--text:#1a1a2e;--border:#e2e8f0}
        *{margin:0;padding:0;box-sizing:border-box}
        body{font-family:'Segoe UI',system-ui,sans-serif;background:var(--bg);color:var(--text);min-height:100vh}
        .admin-header{background:#1a1a2e;color:#fff;padding:12px 20px;display:flex;align-items:center;justify-content:space-between;flex-wrap:wrap;gap:10px;position:sticky;top:0;z-index:100}
        .admin-header h1{font-size:1.1rem;font-weight:800;display:flex;align-items:center;gap:8px}
        .btn-logout{padding:6px 14px;border-radius:8px;border:1px solid rgba(255,255,255,0.2);background:transparent;color:#fff;cursor:pointer;font-size:.8rem;font-family:inherit}
        .btn-logout:hover{background:rgba(255,255,255,0.1)}
        .container{max-width:1300px;margin:0 auto;padding:16px}
        .stats-row{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:10px;margin-bottom:16px}
        .stat-card{background:var(--surface);border-radius:14px;padding:14px;box-shadow:0 2px 8px rgba(0,0,0,0.03);border:1px solid var(--border);text-align:center}
        .stat-card .stat-num{font-size:1.6rem;font-weight:800}
        .stat-card .stat-label{color:#64748b;font-size:.65rem;font-weight:600;text-transform:uppercase;margin-top:2px}
        .tabs{display:flex;gap:4px;margin-bottom:14px;background:var(--surface);border-radius:12px;padding:3px;box-shadow:0 2px 8px rgba(0,0,0,0.03);border:1px solid var(--border);overflow-x:auto}
        .tab-btn{flex:1;padding:9px 12px;border-radius:10px;border:none;background:transparent;cursor:pointer;font-weight:600;font-size:.75rem;color:#64748b;transition:all .3s;font-family:inherit;white-space:nowrap;position:relative}
        .tab-btn.active{background:var(--primary);color:#fff}
        .tab-badge{position:absolute;top:-4px;right:4px;background:#ef4444;color:#fff;padding:1px 5px;border-radius:8px;font-size:.55rem;font-weight:700}
        .panel{background:var(--surface);border-radius:14px;padding:16px;box-shadow:0 2px 8px rgba(0,0,0,0.03);border:1px solid var(--border);margin-bottom:14px}
        .panel h3{font-weight:700;font-size:.95rem;margin-bottom:12px;display:flex;align-items:center;gap:6px}
        .section-hide{display:none}
        .table-wrap{overflow-x:auto}
        table{width:100%;border-collapse:collapse;font-size:.78rem}
        th{background:#f8fafc;padding:9px 10px;text-align:left;font-weight:700;font-size:.65rem;text-transform:uppercase;letter-spacing:.5px;color:#64748b;border-bottom:2px solid var(--border);white-space:nowrap}
        td{padding:8px 10px;border-bottom:1px solid #f1f5f9;font-size:.76rem}
        tr:hover{background:#fafbff}
        .badge{padding:3px 7px;border-radius:8px;font-size:.6rem;font-weight:700;text-transform:uppercase}
        .badge-pending{background:#fef3c7;color:#92400e}.badge-paid{background:#d1fae5;color:#065f46}
        .badge-rejected{background:#fee2e2;color:#991b1b}.badge-live{background:#dbeafe;color:#1e40af}.badge-off{background:#f1f5f9;color:#64748b}
        .btn-sm{padding:4px 8px;border-radius:5px;font-size:.65rem;font-weight:700;border:none;cursor:pointer;transition:all .2s;font-family:inherit;margin:1px}
        .btn-approve{background:#10b981;color:#fff}.btn-approve:hover{background:#059669}
        .btn-reject{background:#ef4444;color:#fff}.btn-reject:hover{background:#dc2626}
        .btn-view{background:#6C5CE7;color:#fff}.btn-view:hover{background:#5A4BD1}
        .btn-live{background:#3b82f6;color:#fff}.btn-off{background:#f59e0b;color:#fff}
        .btn-retry{background:#6C5CE7;color:#fff;padding:8px 16px;border-radius:8px;font-size:.8rem;font-weight:700;border:none;cursor:pointer;font-family:inherit;margin-top:8px}
        .btn-retry:hover{background:#5A4BD1}
        .search-box{padding:8px 12px;border:2px solid var(--border);border-radius:8px;font-size:.8rem;width:220px;outline:none;font-family:inherit}
        .search-box:focus{border-color:var(--primary)}
        .toast{position:fixed;top:16px;right:16px;padding:10px 16px;border-radius:10px;color:#fff;font-weight:600;z-index:9999;font-size:.8rem;animation:slideIn .3s ease}
        .toast.success{background:#10b981}.toast.error{background:#ef4444}
        @keyframes slideIn{from{transform:translateX(120%);opacity:0}to{transform:translateX(0);opacity:1}}
        .login-box{background:#fff;border-radius:18px;padding:28px;max-width:360px;width:90%;text-align:center;box-shadow:0 20px 50px rgba(0,0,0,0.15)}
        .login-box input{width:100%;padding:10px 14px;border:2px solid #e0e0e0;border-radius:10px;font-size:14px;margin-bottom:10px;font-family:inherit}
        .login-box input:focus{border-color:var(--primary);outline:none}
        .login-box button{width:100%;padding:11px;border-radius:10px;background:var(--primary);color:#fff;font-weight:700;border:none;cursor:pointer;font-family:inherit;font-size:15px}
        .modal-overlay{position:fixed;top:0;left:0;width:100%;height:100%;background:rgba(0,0,0,0.5);z-index:1000;display:flex;align-items:center;justify-content:center}
        .modal-box{background:#fff;border-radius:16px;padding:20px;max-width:480px;width:90%;max-height:80vh;overflow-y:auto}
        .empty-state{text-align:center;padding:30px;color:#94a3b8}.empty-state i{font-size:3rem;display:block;margin-bottom:8px}
        .summary-row{display:flex;gap:10px;flex-wrap:wrap;margin-bottom:10px}
        .summary-item{flex:1;min-width:100px;background:#f8fafc;padding:10px;border-radius:8px;text-align:center;font-size:.75rem;font-weight:600}
        .status-indicator{display:inline-flex;align-items:center;gap:4px;font-size:.7rem;color:#64748b;margin-left:8px}
        .status-dot{width:6px;height:6px;border-radius:50%}
        .status-dot.green{background:#10b981}.status-dot.yellow{background:#f59e0b}.status-dot.red{background:#ef4444}
        @media(max-width:600px){.tabs{flex-wrap:wrap}.tab-btn{font-size:.7rem;padding:7px 8px}th,td{padding:5px 6px;font-size:.68rem}}
    </style>
</head>
<body>

    <!-- LOGIN SCREEN -->
    <div id="loginScreen" style="display:flex;align-items:center;justify-content:center;min-height:100vh;background:#f1f5f9">
        <div class="login-box">
            <div style="font-size:3rem;margin-bottom:6px">👑</div>
            <h2 style="font-weight:800;margin-bottom:2px">Admin Panel</h2>
            <p style="color:#64748b;font-size:.8rem;margin-bottom:14px">Manage teachers & payments</p>
            <input type="email" id="loginEmail" placeholder="Email" value="mgbhaukali@gmail.com">
            <input type="password" id="loginPassword" placeholder="Password" value="admin123456">
            <button onclick="adminLogin()"><i class="fas fa-lock"></i> Login</button>
            <p id="loginError" style="color:#ef4444;font-size:.75rem;margin-top:8px;display:none"></p>
            <p style="font-size:.7rem;color:#94a3b8;margin-top:10px;cursor:pointer" onclick="skipLogin()">👁️ View only mode</p>
        </div>
    </div>

    <!-- DASHBOARD -->
    <div id="dashboard" style="display:none">
        <div class="admin-header">
            <h1>👑 THP Admin Panel 
                <span class="status-indicator"><span class="status-dot green" id="connDot"></span><span id="connStatus">Connected</span></span>
            </h1>
            <div style="display:flex;align-items:center;gap:10px">
                <button class="btn-logout" onclick="loadTeachers()" title="Refresh Data"><i class="fas fa-sync"></i> Refresh</button>
                <span style="font-size:.8rem;opacity:.8" id="adminEmail"></span>
                <button class="btn-logout" onclick="logout()">Logout</button>
            </div>
        </div>

        <div class="container">
            <!-- STATS -->
            <div class="stats-row">
                <div class="stat-card"><div class="stat-num" id="statTotal" style="color:#6C5CE7">0</div><div class="stat-label">Total</div></div>
                <div class="stat-card"><div class="stat-num" id="statPending" style="color:#f59e0b">0</div><div class="stat-label">Pending</div></div>
                <div class="stat-card"><div class="stat-num" id="statPaid" style="color:#10b981">0</div><div class="stat-label">Paid</div></div>
                <div class="stat-card"><div class="stat-num" id="statLive" style="color:#3b82f6">0</div><div class="stat-label">Live</div></div>
                <div class="stat-card"><div class="stat-num" id="statRejected" style="color:#ef4444">0</div><div class="stat-label">Rejected</div></div>
                <div class="stat-card"><div class="stat-num" id="statEarnings" style="color:#10b981">₹0</div><div class="stat-label">Earnings</div></div>
            </div>

            <!-- TABS -->
            <div class="tabs">
                <button class="tab-btn active" onclick="switchTab('pending')">⏳ Pending <span class="tab-badge" id="badgePending">0</span></button>
                <button class="tab-btn" onclick="switchTab('all')">📋 All</button>
                <button class="tab-btn" onclick="switchTab('paid')">✅ Paid</button>
                <button class="tab-btn" onclick="switchTab('live')">🟢 Live</button>
                <button class="tab-btn" onclick="switchTab('rejected')">❌ Rejected</button>
            </div>

            <!-- SEARCH & SUMMARY -->
            <div style="display:flex;gap:10px;flex-wrap:wrap;align-items:center;margin-bottom:12px">
                <input type="text" class="search-box" id="searchInput" placeholder="🔍 Search name, email, area..." oninput="renderTable()">
                <div class="summary-row" id="summaryRow"></div>
            </div>

            <!-- TABLE -->
            <div class="panel">
                <h3 id="tableTitle">⏳ Pending Teachers</h3>
                <div class="table-wrap">
                    <table>
                        <thead><tr><th>Name</th><th>Email</th><th>Phone</th><th>Area</th><th>Qualification</th><th>Fees</th><th>Payer</th><th>Payment</th><th>Status</th><th>Date</th><th>Actions</th></tr></thead>
                        <tbody id="tableBody"><tr><td colspan="11"><div class="empty-state"><i class="fas fa-spinner fa-spin"></i><p>Loading teachers...</p></div></td></tr></tbody>
                    </table>
                </div>
            </div>
        </div>
    </div>

    <!-- MODAL -->
    <div class="modal-overlay" id="detailModal" style="display:none" onclick="if(event.target===this)this.style.display='none'">
        <div class="modal-box" id="modalContent"></div>
    </div>

    <!-- SCRIPTS -->
    <script>
        // ============ FIREBASE INIT ============
        firebase.initializeApp({apiKey:"AIzaSyABaZZOMR1-oudAzjGnsN6LvClW5VrkIQY",authDomain:"hometutor-a5c4d.firebaseapp.com",projectId:"hometutor-a5c4d",storageBucket:"hometutor-a5c4d.firebasestorage.app",messagingSenderId:"367381523059",appId:"1:367381523059:web:f4732dcbf1cf6f7993d806"});
        const db = firebase.firestore();
        const auth = firebase.auth();
        
        // ============ FIREBASE SETTINGS FOR BETTER CONNECTION ============
        db.settings({ cacheSizeBytes: firebase.firestore.CACHE_SIZE_UNLIMITED });
        
        // Enable offline persistence
        db.enablePersistence().then(() => {
            console.log('✅ Offline persistence enabled');
        }).catch(err => {
            console.log('Persistence note:', err.code);
        });
        
        let allTeachers = [], currentTab = 'pending', isAdmin = false, loadAttempts = 0;

        // ============ CONNECTION STATUS ============
        function updateConnectionStatus(status, color) {
            document.getElementById('connDot').className = 'status-dot ' + color;
            document.getElementById('connStatus').textContent = status;
        }

        // ============ AUTH ============
        auth.onAuthStateChanged(u => { if (u) { isAdmin = true; showDashboard(u.email); } });
        
        function skipLogin() { isAdmin = false; showDashboard('Viewer Mode'); }
        
        async function adminLogin() {
            const e = document.getElementById('loginEmail').value;
            const p = document.getElementById('loginPassword').value;
            const er = document.getElementById('loginError');
            try {
                await auth.signInWithEmailAndPassword(e, p);
                er.style.display = 'none';
            } catch (ex) {
                er.textContent = '❌ ' + ex.message;
                er.style.display = 'block';
            }
        }
        
        function showDashboard(email) {
            document.getElementById('loginScreen').style.display = 'none';
            document.getElementById('dashboard').style.display = 'block';
            document.getElementById('adminEmail').textContent = email;
            loadTeachers();
        }
        
        function logout() {
            auth.signOut().then(() => {
                isAdmin = false;
                document.getElementById('loginScreen').style.display = 'flex';
                document.getElementById('dashboard').style.display = 'none';
            });
        }

        // ============ LOAD TEACHERS WITH RETRY ============
        async function loadTeachers(retryCount = 0) {
            loadAttempts = retryCount;
            updateConnectionStatus('Loading...', 'yellow');
            
            const tbody = document.getElementById('tableBody');
            tbody.innerHTML = `<tr><td colspan="11"><div class="empty-state">
                <i class="fas fa-spinner fa-spin"></i>
                <p>${retryCount > 0 ? `Retrying... (${retryCount}/3)` : 'Loading teachers...'}</p>
            </div></td></tr>`;
            
            try {
                // PRIMARY: Firestore query
                const snap = await db.collection('teachers').orderBy('submittedAt', 'desc').get();
                
                if (snap.empty && retryCount < 2) {
                    // Empty result - might be connection issue, retry
                    console.log('⚠️ Empty result, retrying...');
                    setTimeout(() => loadTeachers(retryCount + 1), 2000);
                    return;
                }
                
                allTeachers = [];
                snap.forEach(d => allTeachers.push({ id: d.id, ...d.data() }));
                
                console.log('✅ Loaded:', allTeachers.length, 'teachers');
                updateConnectionStatus('Connected', 'green');
                loadAttempts = 0;
                
                updateStats();
                renderTable();
                
            } catch (error) {
                console.error('❌ Load error:', error.message);
                
                if (retryCount < 3) {
                    // RETRY
                    console.log(`🔄 Retrying... (${retryCount + 1}/3)`);
                    updateConnectionStatus('Retrying...', 'yellow');
                    setTimeout(() => loadTeachers(retryCount + 1), 2500);
                } else {
                    // ALL RETRIES FAILED - TRY BACKUP REST API
                    console.log('🔄 Trying backup REST API...');
                    updateConnectionStatus('Trying backup...', 'yellow');
                    await loadTeachersREST();
                }
            }
        }

        // ============ BACKUP: REST API DIRECT FETCH ============
        async function loadTeachersREST() {
            try {
                const projectId = "hometutor-a5c4d";
                const response = await fetch(
                    `https://firestore.googleapis.com/v1/projects/${projectId}/databases/(default)/documents/teachers`,
                    { headers: { 'Content-Type': 'application/json' } }
                );
                
                if (!response.ok) throw new Error('REST API failed');
                
                const data = await response.json();
                
                if (data.documents) {
                    allTeachers = data.documents.map(doc => {
                        const fields = doc.fields || {};
                        const teacher = {};
                        for (const [key, value] of Object.entries(fields)) {
                            if (value.stringValue !== undefined) teacher[key] = value.stringValue;
                            else if (value.integerValue !== undefined) teacher[key] = parseInt(value.integerValue);
                            else if (value.doubleValue !== undefined) teacher[key] = value.doubleValue;
                            else if (value.booleanValue !== undefined) teacher[key] = value.booleanValue;
                            else if (value.timestampValue) teacher[key] = value.timestampValue;
                            else if (value.arrayValue) teacher[key] = (value.arrayValue.values || []).map(v => v.stringValue || '');
                            else teacher[key] = '';
                        }
                        teacher.id = doc.name.split('/').pop();
                        return teacher;
                    });
                    
                    // Sort by submittedAt
                    allTeachers.sort((a, b) => (b.submittedAt || '').localeCompare(a.submittedAt || ''));
                    
                    console.log('✅ REST API Loaded:', allTeachers.length);
                    updateConnectionStatus('Connected (REST)', 'green');
                    
                    updateStats();
                    renderTable();
                } else {
                    throw new Error('No documents');
                }
                
            } catch (restError) {
                console.error('❌ REST API also failed:', restError);
                updateConnectionStatus('Failed', 'red');
                
                document.getElementById('tableBody').innerHTML = `
                    <tr><td colspan="11"><div class="empty-state">
                        <i class="fas fa-cloud-upload-alt"></i>
                        <p>Server is waking up. Please wait 30-60 seconds and retry.</p>
                        <p style="font-size:0.75rem;color:#94a3b8;">Render free plan - server sleeps after inactivity</p>
                        <button onclick="loadTeachers()" class="btn-retry">
                            <i class="fas fa-sync"></i> Retry Now
                        </button>
                    </div></td></tr>`;
            }
        }

        // ============ STATS ============
        function updateStats() {
            document.getElementById('statTotal').textContent = allTeachers.length;
            document.getElementById('statPending').textContent = allTeachers.filter(t => t.paymentStatus === 'pending').length;
            document.getElementById('statPaid').textContent = allTeachers.filter(t => t.paymentStatus === 'paid').length;
            document.getElementById('statLive').textContent = allTeachers.filter(t => t.isActive === true).length;
            document.getElementById('statRejected').textContent = allTeachers.filter(t => t.paymentStatus === 'rejected').length;
            document.getElementById('statEarnings').textContent = '₹' + (allTeachers.filter(t => t.paymentStatus === 'paid').length * 200);
            document.getElementById('badgePending').textContent = allTeachers.filter(t => t.paymentStatus === 'pending').length;
        }

        // ============ TABS ============
        function switchTab(tab) {
            currentTab = tab;
            document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
            event.target.closest('.tab-btn').classList.add('active');
            const titles = { pending: '⏳ Pending Teachers', all: '📋 All Teachers', paid: '✅ Paid Teachers', live: '🟢 Live Teachers', rejected: '❌ Rejected Teachers' };
            document.getElementById('tableTitle').textContent = titles[tab] || 'Teachers';
            renderTable();
        }

        function getFiltered() {
            let f = [...allTeachers];
            if (currentTab === 'pending') f = f.filter(t => t.paymentStatus === 'pending');
            if (currentTab === 'paid') f = f.filter(t => t.paymentStatus === 'paid');
            if (currentTab === 'live') f = f.filter(t => t.isActive === true);
            if (currentTab === 'rejected') f = f.filter(t => t.paymentStatus === 'rejected');
            const s = (document.getElementById('searchInput')?.value || '').toLowerCase();
            if (s) f = f.filter(t => (t.fullName || '').toLowerCase().includes(s) || (t.email || '').toLowerCase().includes(s) || (t.area || '').toLowerCase().includes(s) || (t.phone || '').includes(s) || (t.payerName || '').toLowerCase().includes(s));
            return f;
        }

        function renderTable() {
            const teachers = getFiltered();
            const tbody = document.getElementById('tableBody');
            document.getElementById('summaryRow').innerHTML = `<div class="summary-item">📊 Total: <strong>${teachers.length}</strong></div>`;
            
            if (!teachers.length) {
                tbody.innerHTML = '<tr><td colspan="11"><div class="empty-state"><i class="fas fa-inbox"></i><p>No teachers found</p></div></td></tr>';
                return;
            }
            
            tbody.innerHTML = teachers.map(t => {
                const d = t.submittedAt ? new Date(t.submittedAt.toDate ? t.submittedAt.toDate() : t.submittedAt).toLocaleDateString() : 'N/A';
                return `<tr>
                    <td><strong>${t.fullName || 'N/A'}</strong></td>
                    <td>${t.email || 'N/A'}</td>
                    <td>${t.phone || 'N/A'}</td>
                    <td>${t.area || 'N/A'}</td>
                    <td>${t.qualification || 'N/A'}</td>
                    <td>₹${t.expectedFees || 'N/A'}</td>
                    <td>${t.payerName || 'N/A'}</td>
                    <td><span class="badge badge-${t.paymentStatus || 'pending'}">${t.paymentStatus || 'pending'}</span></td>
                    <td><span class="badge ${t.isActive ? 'badge-live' : 'badge-off'}">${t.isActive ? 'LIVE' : 'OFF'}</span></td>
                    <td>${d}</td>
                    <td>${isAdmin ? `
                        ${t.paymentStatus === 'pending' ? `<button class="btn-sm btn-approve" onclick="approve('${t.id}')">✅</button><button class="btn-sm btn-reject" onclick="reject('${t.id}')">❌</button>` : ''}
                        ${t.paymentStatus === 'paid' && !t.isActive ? `<button class="btn-sm btn-live" onclick="makeLive('${t.id}')">🟢</button>` : ''}
                        ${t.isActive ? `<button class="btn-sm btn-off" onclick="deactivate('${t.id}')">⏸️</button>` : ''}
                    ` : '<span style="font-size:.65rem;color:#94a3b8">View only</span>'}
                    <button class="btn-sm btn-view" onclick="viewDetail('${t.id}')">👁️</button></td></tr>`;
            }).join('');
        }

        // ============ ACTIONS ============
        async function approve(id) {
            if (!confirm('Approve & Go LIVE?')) return;
            await db.collection('teachers').doc(id).update({
                paymentStatus: 'paid', isActive: true, adminApproved: true, isVerified: true,
                updatedAt: firebase.firestore.FieldValue.serverTimestamp()
            });
            toast('✅ Approved!', 'success');
            loadTeachers();
        }
        async function reject(id) {
            if (!confirm('Reject?')) return;
            await db.collection('teachers').doc(id).update({
                paymentStatus: 'rejected', isActive: false, adminApproved: false,
                updatedAt: firebase.firestore.FieldValue.serverTimestamp()
            });
            toast('❌ Rejected', 'success');
            loadTeachers();
        }
        async function makeLive(id) {
            await db.collection('teachers').doc(id).update({
                isActive: true, adminApproved: true,
                updatedAt: firebase.firestore.FieldValue.serverTimestamp()
            });
            toast('🟢 LIVE!', 'success');
            loadTeachers();
        }
        async function deactivate(id) {
            if (!confirm('Deactivate?')) return;
            await db.collection('teachers').doc(id).update({
                isActive: false,
                updatedAt: firebase.firestore.FieldValue.serverTimestamp()
            });
            toast('⏸️ Deactivated', 'success');
            loadTeachers();
        }

        function viewDetail(id) {
            const t = allTeachers.find(x => x.id === id);
            if (!t) return;
            document.getElementById('modalContent').innerHTML = `
                <h3 style="font-weight:800;margin-bottom:10px">👤 ${t.fullName || 'N/A'}</h3>
                <div style="display:grid;grid-template-columns:1fr 1fr;gap:4px;font-size:.8rem">
                    <p><strong>Email:</strong> ${t.email}</p><p><strong>Phone:</strong> ${t.phone}</p>
                    <p><strong>City:</strong> ${t.city || 'Prayagraj'}</p><p><strong>Area:</strong> ${t.area}</p>
                    <p><strong>Qualification:</strong> ${t.qualification}</p><p><strong>Fees:</strong> ₹${t.expectedFees}/hr</p>
                    <p><strong>Experience:</strong> ${t.experience || 'N/A'}</p>
                    <p><strong>Subjects:</strong> ${(t.subjects || []).join(', ')}</p>
                    <p><strong>Classes:</strong> ${(t.classes || []).join(', ')}</p>
                    <p><strong>Boards:</strong> ${(t.courses || []).join(', ')}</p>
                    <p><strong>Payer Name:</strong> ${t.payerName || 'N/A'}</p>
                    <p><strong>Payment:</strong> <span class="badge badge-${t.paymentStatus}">${t.paymentStatus}</span></p>
                    <p><strong>Status:</strong> <span class="badge ${t.isActive ? 'badge-live' : 'badge-off'}">${t.isActive ? 'LIVE' : 'OFF'}</span></p>
                    <p><strong>Submitted:</strong> ${t.submittedAt ? new Date(t.submittedAt.toDate ? t.submittedAt.toDate() : t.submittedAt).toLocaleString() : 'N/A'}</p>
                </div>
                ${t.profilePhoto ? `<img src="${t.profilePhoto}" style="width:80px;border-radius:10px;margin-top:8px">` : ''}
                <button onclick="document.getElementById('detailModal').style.display='none'" style="width:100%;margin-top:10px;padding:8px;border-radius:8px;background:#f1f5f9;border:none;cursor:pointer;font-weight:600">Close</button>`;
            document.getElementById('detailModal').style.display = 'flex';
        }

        function toast(m, t) {
            const e = document.querySelector('.toast');
            if (e) e.remove();
            const d = document.createElement('div');
            d.className = 'toast ' + t;
            d.textContent = m;
            document.body.appendChild(d);
            setTimeout(() => d.remove(), 3000);
        }

        // ============ AUTO-REFRESH EVERY 30 SECONDS ============
        setInterval(() => {
            if (document.getElementById('dashboard').style.display !== 'none') {
                console.log('🔄 Auto-refreshing data...');
                loadTeachers();
            }
        }, 30000);

        console.log('👑 Fixed Admin Panel Ready!');
        console.log('✨ Features: Retry Logic, REST API Backup, Offline Persistence, Auto-Refresh');
        console.log('📧 Login: mgbhaukali@gmail.com / admin123456');
    </script>
</body>
</html>
